name: 🚀 Deploy
on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ⬣ Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6
      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: 📥 Download deps
        run: npm ci

      - name: 🔨 Build App
        run: npm run build

      - name: 🔬 Lint
        run: npm run lint

      - name: 🔎 Type check
        run: npm run typecheck
